[workspace]
resolver = "3"
members = [
    "cosmic-google-common",
    "cosmic-applet-gmail",
    "cosmic-applet-google-agenda",
    "cosmic-applet-taxi",
    "cosmic-applet-slack",
    "cosmic-applet-quotabar",
    "cosmic-applet-windowrules",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Laurent Constantin"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
configparser = "3"
dirs = "7"
futures-util = "0.3"
keyring = "4"
libc = "0.2"
logind-zbus = { version = "5", default-features = false }
notify-rust = "4"
oauth2 = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Pinned to the revisions shipped by COSMIC epoch-1.8.0 so the applets bind the
# same Wayland protocols (e.g. cosmic_corner_radius_manager_v1) as the installed
# cosmic-comp. Bump these together with the desktop when COSMIC is upgraded.
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", rev = "d4d71fd53e5ed6bd3a430089114dffa2da3cd498", default-features = false, features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland", "winit"] }
cosmic-config = { git = "https://github.com/pop-os/libcosmic.git", rev = "d4d71fd53e5ed6bd3a430089114dffa2da3cd498", package = "cosmic-config" }
cosmic-config-derive = { git = "https://github.com/pop-os/libcosmic.git", rev = "d4d71fd53e5ed6bd3a430089114dffa2da3cd498", package = "cosmic-config-derive" }

cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols.git", rev = "32283d7", default-features = false, features = ["client"] }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols.git", rev = "32283d7" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
bitflags = "2"

cosmic-google-common = { path = "cosmic-google-common" }

[profile.release]
opt-level = 3
lto = true

# Optimized but skips the LTO link pass — useful while iterating on a single
# applet. Cuts each binary's release link from ~5–7 min to ~30–60 s on a
# 16-thread machine. Use via `just build-fast <crate>` or `cargo build
# --profile=release-fast -p <crate>`.
[profile.release-fast]
inherits = "release"
lto = false
